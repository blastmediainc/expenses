<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blast Media | Employee Portal</title><style>body{font:16px system-ui;background:#f4f5f7;color:#20252b;margin:0}header{background:#20252b;color:white;padding:20px;font-weight:800}main{max-width:900px;margin:24px auto;padding:16px}section{background:white;border:1px solid #ddd;border-radius:12px;padding:20px;margin-bottom:16px}input,select,button{font:inherit;padding:10px;border:1px solid #ccc;border-radius:6px;margin:5px;max-width:95%}button{background:#20252b;color:white;cursor:pointer}label{display:block}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}#msg{white-space:pre-wrap;color:#a32c21}small{color:#666}a{color:#245c9e}</style><header>BLAST MEDIA &nbsp; | &nbsp; Employee Portal</header><main><p id="msg" role="alert"></p><section id="login"><h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign in</button><button id="reset">Email password setup link</button></section><section id="setup" hidden><h2>Set your password</h2><input id="newpass" type="password" placeholder="At least 12 characters"><button id="savepass">Save password</button></section><div id="app" hidden><section><h2 id="welcome"></h2><button id="logout">Sign out</button><label>Reporting period <input id="period" type="date"></label><button id="load">Open report</button><p id="status"></p><div id="editor" hidden><h3>Add entry</h3><select id="kind"><option value="km">Mileage (km)</option><option value="receipt">Receipt ($)</option><option value="ot">Overtime (hours)</option></select><input id="day" type="date"><input id="desc" placeholder="Business purpose / project"><input id="amount" type="number" min="0" step="0.01" placeholder="Amount"><div id="maps"><input id="origin" placeholder="Starting address"><input id="dest" placeholder="Destination"><button id="route">Open Google Maps</button><small>Enter the route distance in km after checking Maps.</small></div><input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" hidden><button id="add">Add entry</button><button id="submit">Submit final report</button></div><div id="rows"></div><h3 id="totals"></h3></section><section id="admin" hidden><h2>Payroll administration</h2><div id="mfa"></div><button id="refresh">Refresh period</button><button id="export">Download approved CSV</button><div id="all"></div></section></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const s=createClient('https://xqesctppdtorkzsgaiqr.supabase.co','sb_publishable_ck-u6uZ-VqIFcMllH3-xMQ_RRenP-T3'); const $=id=>document.getElementById(id); let user,staff,report,summary=[]; const msg=t=>$('msg').textContent=t||''; const run=fn=>async()=>{try{msg('');await fn()}catch(e){msg(e.message||String(e))}}; const check=r=>{if(r.error)throw r.error;return r.data}; const date=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getDate()<=15?'01':'16'}`}; $('period').value=date(); $('day').value=new Date().toLocaleDateString('en-CA'); const el=(tag,text,parent)=>{let x=document.createElement(tag);x.textContent=text;parent.append(x);return x}; const btn=(text,parent,fn)=>{let b=el('button',text,parent);b.onclick=run(fn);return b}; const totals=es=>{let k=0,r=0,o=0;for(let e of es){if(e.kind==='km')k+=Number(e.amount);if(e.kind==='receipt')r+=Number(e.amount);if(e.kind==='ot')o+=Number(e.amount)}return [k,r,o]}; const money=n=>n.toFixed(2); const receipt=async path=>{let d=check(await s.storage.from('receipts').createSignedUrl(path,60));window.open(d.signedUrl,'_blank','noopener,noreferrer')};
async function init(){user=check(await s.auth.getUser())?.user;if(!user)return;staff=check(await s.from('staff').select('*').eq('id',user.id).single());$('login').hidden=true;$('app').hidden=false;$('welcome').textContent='Welcome, '+staff.name;$('admin').hidden=!staff.admin;if(staff.admin)await mfa();await load()}
async function load(){let p=$('period').value;if(!['01','16'].includes(p.slice(-2)))throw Error('Choose the 1st or 16th.');report=check(await s.from('reports').select('*').eq('owner',user.id).eq('period',p).maybeSingle());if(!report)report=check(await s.from('reports').insert({owner:user.id,period:p}).select().single());$('status').textContent=report.status;$('editor').hidden=!['draft','returned'].includes(report.status);let es=check(await s.from('entries').select('*').eq('report',report.id).order('day'));$('rows').replaceChildren();for(let e of es){let line=el('p',`${e.day} · ${e.kind} · ${e.description} · ${e.amount}`, $('rows'));if(e.attachment)btn('Receipt',line,()=>receipt(e.attachment));if(!$('editor').hidden)btn('Remove',line,async()=>{check(await s.from('entries').delete().eq('id',e.id));await load()})}let [k,r,o]=totals(es);$('totals').textContent=`${k} km · Mileage $${money(k*.7)} · Receipts $${money(r)} · Total $${money(k*.7+r)} · OT ${o} hrs`}
$('signin').onclick=run(async()=>{check(await s.auth.signInWithPassword({email:$('email').value,password:$('password').value}));await init()});$('reset').onclick=run(async()=>{check(await s.auth.resetPasswordForEmail($('email').value,{redirectTo:location.origin+location.pathname}));msg('If eligible, check your email.')});$('savepass').onclick=run(async()=>{if($('newpass').value.length<12)throw Error('Use at least 12 characters');check(await s.auth.updateUser({password:$('newpass').value}));$('setup').hidden=true;await init()});$('logout').onclick=run(async()=>{await s.auth.signOut();location.reload()});$('load').onclick=run(load);$('kind').onchange=()=>{$('maps').hidden=$('kind').value!=='km';$('file').hidden=$('kind').value!=='receipt'};$('route').onclick=()=>window.open('https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+encodeURIComponent($('origin').value)+'&destination='+encodeURIComponent($('dest').value),'_blank','noopener,noreferrer');$('add').onclick=run(async()=>{let kind=$('kind').value,amount=Number($('amount').value),attachment=null;if(!Number.isFinite(amount)||amount<=0||!$('desc').value.trim())throw Error('Enter a positive amount and description.');if(kind==='receipt'){let f=$('file').files[0];if(!f)throw Error('Attach receipt');attachment=user.id+'/'+crypto.randomUUID();check(await s.storage.from('receipts').upload(attachment,f,{contentType:f.type}))}check(await s.from('entries').insert({report:report.id,kind,day:$('day').value,description:$('desc').value,amount,attachment}));$('amount').value='';$('desc').value='';$('file').value='';await load()});$('submit').onclick=run(async()=>{if(confirm('Submit and lock this report?')){check(await s.rpc('change_status',{rid:report.id,next_status:'submitted'}));await load()}});
async function mfa(){let a=check(await s.auth.mfa.getAuthenticatorAssuranceLevel());$('mfa').replaceChildren();if(a.currentLevel==='aal2'){el('p','MFA verified',$('mfa'));return}let factors=check(await s.auth.mfa.listFactors());let f=factors.totp.find(x=>x.status==='verified');if(!f){btn('Set up authenticator',$('mfa'),async()=>{let n=check(await s.auth.mfa.enroll({factorType:'totp'}));let img=document.createElement('img');img.src=n.totp.qr_code;$('mfa').append(img);verify(n.id)})}else verify(f.id)}function verify(id){let i=el('input','',$('mfa'));i.placeholder='Authenticator code';btn('Verify',$('mfa'),async()=>{check(await s.auth.mfa.challengeAndVerify({factorId:id,code:i.value}));await mfa()})}
async function refresh(){let a=check(await s.auth.mfa.getAuthenticatorAssuranceLevel());if(a.currentLevel!=='aal2')throw Error('Verify MFA first');let rs=check(await s.from('reports').select('*,staff(name),entries(*)').eq('period',$('period').value));let people=check(await s.from('staff').select('id,name').eq('active',true));summary=[];$('all').replaceChildren();for(let p of people){let r=rs.find(x=>x.owner===p.id),[k,c,o]=totals(r?.entries||[]);let box=el('section','',$('all'));el('h3',p.name+' · '+(r?.status||'missing'),box);el('p',`${k} km · $${money(k*.7+c)} reimbursement · ${o} OT hours`,box);for(let e of r?.entries||[]){let line=el('p',`${e.day} ${e.kind} ${e.description} ${e.amount}`,box);if(e.attachment)btn('Receipt',line,()=>receipt(e.attachment))}if(r?.status==='submitted')for(let st of ['approved','returned'])btn(st,box,async()=>{check(await s.rpc('change_status',{rid:r.id,next_status:st}));await refresh()});if(r?.status==='approved')summary.push([p.name,k,money(k*.7),money(c),money(k*.7+c),o])}}$('refresh').onclick=run(refresh);$('export').onclick=run(async()=>{await refresh();let esc=v=>'"'+String(v).replace(/^[=+\-@\t\r]/,"'$&").replaceAll('"','""')+'"';let csv=[['Employee','KM','Mileage','Receipts','Total','OT hours'],...summary].map(r=>r.map(esc).join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='payroll-'+$('period').value+'.csv';a.click();URL.revokeObjectURL(a.href)});s.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'||(event==='SIGNED_IN'&&location.hash.includes('type=invite'))){$('setup').hidden=false;$('login').hidden=true}});if(location.hash.includes('type=invite')||location.hash.includes('type=recovery')){$('setup').hidden=false;$('login').hidden=true}else s.auth.getSession().then(({data})=>{if(data.session)run(init)()});
</script></html>
